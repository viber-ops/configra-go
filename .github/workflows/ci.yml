name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  GOFLAGS: '-mod=readonly'

jobs:
  go:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        go: ['1.25.13', '1.26.7']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Test, vet and verify modules
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go mod verify
      - name: Check reachable vulnerabilities
        if: matrix.go == '1.26.7' && matrix.os == 'ubuntu-24.04'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
